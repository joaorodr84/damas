<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Damas</h1>
    <p id="turn"></p>
  </header>

  <div id="board-wrap">
    <div id="board" role="grid" aria-label="Tabuleiro de damas"></div>
  </div>

  <div class="toolbar">
    <button id="undo">Desfazer</button>
    <button id="reset">Novo jogo</button>
    <button id="toggle-online">Online</button>
    <button id="toggle-settings">Definições</button>
  </div>

  <aside id="online" data-state="idle" hidden>
    <h2>Jogar online</h2>
    <div class="net-idle">
      <button id="net-create" class="primary">Criar jogo</button>
      <span class="or">ou</span>
      <form id="net-join-form">
        <input id="net-code" placeholder="Código" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código do jogo">
        <button type="submit">Entrar</button>
      </form>
    </div>
    <div class="net-wait">
      <p>Partilha este código com o teu amigo:</p>
      <div class="code-row"><strong id="net-code-show">······</strong>
        <button id="net-copy-code">Copiar código</button>
        <button id="net-copy-link">Copiar ligação</button></div>
      <p class="muted">À espera que o teu amigo entre…</p>
    </div>
    <div class="net-live">
      <p id="net-score"></p>
    </div>
    <p id="net-status" class="muted" role="status"></p>
    <button id="net-leave" class="net-wait net-live">Sair do jogo online</button>
  </aside>

  <aside id="settings" hidden>
    <h2>Definições</h2>
    <label>Tema
      <select id="s-theme">
        <option value="walnut">Nogueira</option>
        <option value="marble">Mármore</option>
        <option value="midnight">Meia-noite</option>
        <option value="classic">Clássico</option>
      </select>
    </label>
    <label>Modo
      <select id="s-mode">
        <option value="portuguese">Regras portuguesas</option>
        <option value="free">Jogo livre</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="s-mandatory"> Captura obrigatória</label>
    <label class="check"><input type="checkbox" id="s-majority"> Lei da maioria (tomar o maior número de peças)</label>
    <label class="check"><input type="checkbox" id="s-menBackward"> Peões capturam para trás</label>
    <label>Tamanho do tabuleiro
      <select id="s-size">
        <option value="8">8 × 8 (português)</option>
        <option value="10">10 × 10</option>
      </select>
    </label>
    <label>Quem começa
      <select id="s-first">
        <option value="white">Brancas</option>
        <option value="black">Pretas</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="s-coords"> Mostrar coordenadas</label>
    <label class="check"><input type="checkbox" id="s-flip"> Rodar tabuleiro a cada jogada</label>
    <label class="check"><input type="checkbox" id="s-hints"> Destacar casas livres</label>
    <label class="check"><input type="checkbox" id="s-anim"> Animações</label>
    <p class="note">Jogo livre: move qualquer peça para uma casa escura vazia; duplo clique promove/despromove a dama; clique direito remove a peça.</p>
  </aside>
</main>
<script src="js/vendor/peerjs.min.js"></script>
<script src="js/config.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
